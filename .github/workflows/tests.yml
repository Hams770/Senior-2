name: backend-tests
on: [push, pull_request, workflow_dispatch]
jobs:
  sqlite:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Start the server and call it
        run: |
          python -m app.cli create-admin admin@hiremind.test 'AdminPass123'
          uvicorn app.main:app --port 8000 & sleep 4
          curl -sf http://127.0.0.1:8000/api/health
          curl -sf -o /dev/null http://127.0.0.1:8000/index.html
          curl -sf -X POST http://127.0.0.1:8000/api/auth/login -d 'username=admin@hiremind.test&password=AdminPass123' | grep access_token
  e2e-nfr:
    name: Browser test of every screen and non-functional tests
    runs-on: ubuntu-latest
    permissions: { contents: write }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: hiremind, POSTGRES_PASSWORD: hiremind, POSTGRES_DB: hiremind }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements.txt playwright==1.49.1 && python -m playwright install --with-deps chromium
      - name: Start a server on an empty SQLite database (browser test)
        working-directory: backend
        run: |
          python -m app.cli create-admin admin@hiremind.test 'AdminPass123'
          nohup uvicorn app.main:app --port 8000 > ../server.log 2>&1 &
          sleep 4 && curl -sf http://127.0.0.1:8000/api/health
      - run: python e2e/run_e2e.py
      - name: Usability kit seeds the platform
        run: python evaluation/ut01_usability/seed_usability.py --admin admin@hiremind.test --password 'AdminPass123'
      - name: Extraction kit downloads and prepares 3 CVs
        run: |
          pip install huggingface_hub==0.30.2 pandas==2.2.3 openpyxl==3.1.5
          python evaluation/at01_extraction/select_cvs.py --per-label 1
          ls evaluation/at01_extraction/cvs
      - name: Start a server on PostgreSQL (non-functional tests)
        working-directory: backend
        env: { DATABASE_URL: "postgresql+psycopg2://hiremind:hiremind@localhost:5432/hiremind", UPLOAD_DIR: /tmp/uploads-pg }
        run: |
          python -m app.cli create-admin admin@hiremind.test 'AdminPass123'
          nohup uvicorn app.main:app --port 8001 --workers 2 > ../server-pg.log 2>&1 & echo $! > ../pg.pid
          sleep 5 && curl -sf http://127.0.0.1:8001/api/health
      - run: python nfr/run_nfr.py load
      - name: Restart the server, then check nothing was lost
        working-directory: backend
        env: { DATABASE_URL: "postgresql+psycopg2://hiremind:hiremind@localhost:5432/hiremind", UPLOAD_DIR: /tmp/uploads-pg }
        run: |
          pkill -f "uvicorn app.main:app --port 8001" || true; sleep 2
          nohup uvicorn app.main:app --port 8001 --workers 2 >> ../server-pg.log 2>&1 &
          sleep 5 && curl -sf http://127.0.0.1:8001/api/health
      - run: python nfr/run_nfr.py persist
      - if: always()
        run: tail -30 server.log; tail -30 server-pg.log
      - name: Publish screenshots and reports to the test-results branch
        if: always() && github.event_name == 'push'
        run: |
          cd test-results && rm -f nfr_state.json && git init -q && git checkout -q -b test-results
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Test results for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" test-results
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: hiremind, POSTGRES_PASSWORD: hiremind, POSTGRES_DB: hiremind }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    env:
      DATABASE_URL: postgresql+psycopg2://hiremind:hiremind@localhost:5432/hiremind
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Create all tables in PostgreSQL and run the API against it
        run: |
          python -m app.cli create-admin admin@hiremind.test 'AdminPass123'
          python -c "from sqlalchemy import inspect; from app.db import engine; t=sorted(inspect(engine).get_table_names()); print(t); assert len(t)==13"
          uvicorn app.main:app --port 8000 & sleep 4
          curl -sf -X POST http://127.0.0.1:8000/api/auth/login -d 'username=admin@hiremind.test&password=AdminPass123' | grep access_token
