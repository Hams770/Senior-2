name: backend-tests
on: [push, pull_request, workflow_dispatch]
jobs:
  sqlite:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Start the server and call it
        run: |
          python -m app.cli create-admin admin@hiremind.test 'AdminPass123'
          uvicorn app.main:app --port 8000 & sleep 4
          curl -sf http://127.0.0.1:8000/api/health
          curl -sf -o /dev/null http://127.0.0.1:8000/index.html
          curl -sf -X POST http://127.0.0.1:8000/api/auth/login -d 'username=admin@hiremind.test&password=AdminPass123' | grep access_token
  e2e:
    name: Browser test of every screen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements.txt playwright==1.49.1 && python -m playwright install --with-deps chromium
      - name: Start the server on an empty database
        working-directory: backend
        run: |
          python -m app.cli create-admin admin@hiremind.test 'AdminPass123'
          nohup uvicorn app.main:app --port 8000 > ../server.log 2>&1 &
          sleep 4 && curl -sf http://127.0.0.1:8000/api/health
      - run: python e2e/run_e2e.py
      - if: always()
        run: cat server.log | tail -40
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: screenshots, path: e2e/screenshots }
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: hiremind, POSTGRES_PASSWORD: hiremind, POSTGRES_DB: hiremind }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    env:
      DATABASE_URL: postgresql+psycopg2://hiremind:hiremind@localhost:5432/hiremind
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Create all tables in PostgreSQL and run the API against it
        run: |
          python -m app.cli create-admin admin@hiremind.test 'AdminPass123'
          python -c "from sqlalchemy import inspect; from app.db import engine; t=sorted(inspect(engine).get_table_names()); print(t); assert len(t)==13"
          uvicorn app.main:app --port 8000 & sleep 4
          curl -sf -X POST http://127.0.0.1:8000/api/auth/login -d 'username=admin@hiremind.test&password=AdminPass123' | grep access_token
