<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HireMind — Candidates</title>
<link rel="icon" href="img/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/design-system.css">
</head>
<body>
<div id="app-root"></div>
<script src="js/app.js"></script>
<script src="js/api.js"></script>
<script src="js/shell.js"></script>
<script>
startPage('Candidates', '', ['hr', 'admin'], async body => {
  body.innerHTML = `<div class="section-header mb-24"><div><div class="section-title">Applicants</div>
    <div class="section-subtitle">Rate the evidence, evaluate, then record your decision. The system never decides for you.</div></div>
    <div id="picker" style="margin-left:auto"></div></div>
    <div class="card"><div id="list"></div></div>`;
  await jobPicker('picker', id => { JOB = id; load(); });
});
let JOB, ROWS = [];
async function load() {
  ROWS = await api(`/api/jobs/${JOB}/candidates`);
  document.getElementById('list').innerHTML = ROWS.length ? `<table class="data-table"><thead><tr>
    <th>Candidate</th><th>Applied</th><th>CV</th><th>Score</th><th>Status</th><th>Decision</th><th></th></tr></thead><tbody>
    ${ROWS.map(r => `<tr><td><strong>${esc(r.candidate)}</strong><div class="hm-note">${esc(r.email)}</div></td>
      <td>${fmtDate(r.applied_at)}</td><td>${statusBadge(r.parse_status)}</td>
      <td>${r.score === null ? '—' : `<strong>${fmtScore(r.score)}</strong> ${statusBadge(r.stage)}`}</td>
      <td>${statusBadge(r.status)}</td><td>${r.decision ? statusBadge(r.decision) : '—'}</td>
      <td><div class="hm-row-actions">
        <a class="btn btn-ghost btn-sm" href="api/applications/${r.application_id}/cv" onclick="return downloadCV(event, ${r.application_id})">CV</a>
        <a class="btn btn-ghost btn-sm" href="screening.html?app=${r.application_id}">Evidence</a>
        <button class="btn btn-primary btn-sm" onclick="review(${r.application_id})">Review</button></div></td></tr>`).join('')}
    </tbody></table>` : '<div class="hm-empty">No applications for this job yet.</div>';
}
async function downloadCV(e, id) {
  e.preventDefault();
  const res = await api(`/api/applications/${id}/cv`, { raw: true });
  if (!res.ok) return showToast('Could not download the CV', 'error');
  const url = URL.createObjectURL(await res.blob()); window.open(url, '_blank');
}
async function review(id) {
  const r = ROWS.find(x => x.application_id === id);
  const evs = await api(`/api/applications/${id}/evaluations`);
  const ev = evs[evs.length - 1];
  const rate = k => `<div class="form-group"><label class="form-label">${{ exp: 'Experience', edu: 'Education', soft: 'Soft skills' }[k]} (0–100)</label>
    <input class="form-input" type="text" inputmode="decimal" id="r-${k}" value="${r.hr_ratings[k] ?? ''}" placeholder="not rated"></div>`;
  modal(`<div class="section-title mb-8">${esc(r.candidate)}</div>
    <div class="hm-note mb-16">Skills found in the CV: ${r.skills.map(esc).join(', ') || 'none (see CV Screening)'}</div>
    <div class="grid grid-3 gap-16">${rate('exp')}${rate('edu')}${rate('soft')}</div>
    <div style="display:flex;gap:8px;margin-bottom:18px">
      <button class="btn btn-ghost btn-sm" onclick="saveRatings(${id})">Save ratings</button>
      <button class="btn btn-primary btn-sm" onclick="evaluateApplication(${id})">Evaluate now</button></div>
    <div id="ev">${ev ? evalHTML(ev) : '<div class="hm-note">Not evaluated yet.</div>'}</div>
    <div class="divider" style="margin:18px 0"></div>
    <div class="section-title mb-8" style="font-size:15px">Your decision</div>
    ${r.final_outcome ? `<p>Final outcome recorded: ${statusBadge(r.final_outcome)}</p>` : `
    <div class="form-group"><select class="form-select" id="d-out"><option value="advance">Advance</option><option value="hold">Hold</option><option value="reject">Reject</option></select></div>
    <div class="form-group"><textarea class="form-textarea" id="d-reason" rows="2" placeholder="Reason (at least 10 characters; kept in the audit log, never shown to the candidate)"></textarea></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary btn-sm" onclick="recordDecision(${id})">Record decision</button>
      ${r.decision === 'advance' ? `<button class="btn btn-ghost btn-sm" onclick="recordOutcome(${id},'hired')">Mark hired</button>` : ''}
      ${r.decision ? `<button class="btn btn-ghost btn-sm" onclick="recordOutcome(${id},'not_hired')">Mark not hired</button>` : ''}</div>`}`);
}
function evalHTML(ev) {
  const names = { tech: 'Technical skills match', exp: 'Experience', edu: 'Education', soft: 'Soft skills', ver: 'Skill assessments' };
  return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><span style="font-size:28px;font-weight:800">${fmtScore(ev.score)}</span>${statusBadge(ev.stage)}<span class="hm-note">policy v${ev.policy_version} · ${fmtDate(ev.created_at)}</span></div>
    ${Object.entries(ev.components).map(([k, v]) => `<div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0">
      <span>${names[k]} <span class="hm-note">(weight ${ev.weights[k]})</span></span><span>${v === null ? '<span class="badge badge-amber">not assessed</span>' : Math.round(v)}</span></div>`).join('')}
    ${ev.evidence.missing_skills.length ? `<div class="hm-note" style="margin-top:6px">Required skills not found in the CV: ${ev.evidence.missing_skills.map(esc).join(', ')}</div>` : ''}`;
}
async function saveRatings(id) {
  const body = {};
  for (const k of ['exp', 'edu', 'soft']) { body[k] = toNumber(document.getElementById('r-' + k).value); }
  await act(() => api(`/api/applications/${id}/ratings`, { method: 'PUT', body }), 'Ratings saved');
  ROWS = await api(`/api/jobs/${JOB}/candidates`);
}
async function evaluateApplication(id) {
  const ev = await act(() => api(`/api/applications/${id}/evaluate`, { method: 'POST' }), 'Evaluated');
  document.getElementById('ev').innerHTML = evalHTML(ev); load();
}
async function recordDecision(id) {
  await act(() => api(`/api/applications/${id}/decision`, { method: 'POST', body: { outcome: document.getElementById('d-out').value, reason: document.getElementById('d-reason').value.trim() } }), 'Decision recorded');
  closeModal(); load();
}
async function recordOutcome(id, o) {
  await act(() => api(`/api/applications/${id}/outcome`, { method: 'POST', body: { outcome: o } }), 'Outcome recorded');
  closeModal(); load();
}
</script>
</body>
</html>
