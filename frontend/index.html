<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HireMind — Dashboard</title>
<link rel="icon" href="img/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/design-system.css">
</head>
<body>
<div id="app-root"></div>
<script src="js/app.js"></script>
<script src="js/api.js"></script>
<script src="js/shell.js"></script>
<script>
startPage('Dashboard', '', ['hr', 'admin'], async body => {
  const a = await api('/api/analytics');
  const open = a.jobs.published || 0;
  const toGrade = a.assessments.submitted || 0;
  const needFix = a.parse_status.failed || 0;
  body.innerHTML = `
  <div class="section-header mb-24"><div>
    <div class="section-title">Welcome, ${esc(Auth.user.full_name || Auth.user.email)}</div>
    <div class="section-subtitle">Every number on this page comes from your stored jobs and applications.</div></div>
    <a href="jobs.html" class="btn btn-primary btn-sm" style="margin-left:auto">+ New job</a></div>
  <div class="grid grid-4 mb-24">
    ${stat('', 'Applications', a.applications, 'var(--teal)')}
    ${stat('', 'Open jobs', open, 'var(--emerald)')}
    ${stat('', 'Mean score', fmtScore(a.evaluations.mean_score), 'var(--amber)')}
    ${stat('', 'Final evaluations', a.evaluations.final, 'var(--violet)')}
  </div>
  <div class="grid grid-2 gap-20">
    <div class="card"><div class="card-header"><span class="card-title">Needs your attention</span></div><div class="card-body">
      ${todo(needFix, 'CVs could not be read (scanned or damaged) — correct them by hand', 'screening.html')}
      ${todo(toGrade, 'practical answers are waiting for rubric grading', 'verification.html')}
      ${todo((a.evaluations.evaluated || 0) - (a.evaluations.final || 0), 'evaluations are still provisional (evidence missing)', 'candidates.html')}
      ${todo(a.application_status.submitted || 0, 'new applications have not been assessed yet', 'candidates.html')}
    </div></div>
    <div class="card"><div class="card-header"><span class="card-title">Jobs</span><a href="analytics.html" class="btn btn-ghost btn-sm">Open analytics</a></div>
      ${a.per_job.length ? `<table class="data-table"><thead><tr><th>Job</th><th>Status</th><th>Applications</th><th>Mean score</th></tr></thead><tbody>
      ${a.per_job.map(j => `<tr><td>${esc(j.title)}</td><td>${statusBadge(j.status)}</td><td>${j.applications}</td><td>${fmtScore(j.mean_score)}</td></tr>`).join('')}
      </tbody></table>` : '<div class="hm-empty">No jobs yet.</div>'}
    </div>
  </div>`;
});
function stat(icon, label, value, color) {
  return `<div class="stat-card"><div class="stat-label">${label}</div><div class="stat-value">${esc(value)}</div></div>`;
}
function todo(n, text, href) {
  if (!n) return '';
  return `<a href="${href}" style="display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule);color:inherit;text-decoration:none">
    <span class="badge badge-amber">${n}</span><span style="font-size:13px">${text}</span></a>`;
}
</script>
</body>
</html>
