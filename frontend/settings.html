<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HireMind — Settings</title>
<link rel="icon" href="img/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/design-system.css">
</head>
<body>
<div id="app-root"></div>
<script src="js/app.js"></script>
<script src="js/api.js"></script>
<script src="js/shell.js"></script>
<script>
startPage('Settings', '', ['hr', 'admin'], async body => {
  const u = Auth.user;
  body.innerHTML = `<div class="grid grid-2 gap-20">
    <div class="card"><div class="card-header"><span class="card-title">Your account</span></div><div class="card-body">
      <dl class="hm-kv"><dt>Name</dt><dd>${esc(u.full_name || '—')}</dd><dt>Email</dt><dd>${esc(u.email)}</dd><dt>Role</dt><dd>${esc(u.role)}</dd></dl></div></div>
    ${u.role === 'admin' ? `<div class="card"><div class="card-header"><span class="card-title">Add an HR account</span></div><div class="card-body">
      <form onsubmit="addStaff(event)">
        <div class="form-group"><label class="form-label">Full name</label><input class="form-input" id="s-name"></div>
        <div class="form-group"><label class="form-label">Email</label><input class="form-input" id="s-email" type="email" required></div>
        <div class="form-group"><label class="form-label">Temporary password (8+ characters)</label><input class="form-input" id="s-pw" required minlength="8"></div>
        <div class="form-group"><label class="form-label">Role</label><select class="form-select" id="s-role"><option value="hr">HR</option><option value="admin">Administrator</option></select></div>
        <button class="btn btn-primary btn-sm">Create account</button></form></div></div>
    <div class="card" style="grid-column:1/-1"><div class="card-header"><span class="card-title">Audit log (latest 50)</span></div><div id="audit"></div></div>` : ''}
  </div>`;
  if (u.role === 'admin') loadAudit();
});
async function addStaff(e) {
  e.preventDefault();
  await act(() => api('/api/auth/staff', { method: 'POST', body: { full_name: document.getElementById('s-name').value, email: document.getElementById('s-email').value,
    password: document.getElementById('s-pw').value, role: document.getElementById('s-role').value } }), 'Account created');
  e.target.reset(); loadAudit();
}
async function loadAudit() {
  const log = await api('/api/audit?limit=50');
  document.getElementById('audit').innerHTML = `<table class="data-table"><thead><tr><th>When</th><th>Who</th><th>Action</th><th>Record</th></tr></thead><tbody>
    ${log.map(e => `<tr><td>${new Date(e.created_at).toLocaleString('en-GB')}</td><td>#${e.actor_id ?? '—'}</td><td>${esc(e.action.replace(/_/g, ' '))}</td><td>${esc(e.entity)} ${e.entity_id ?? ''}</td></tr>`).join('')}</tbody></table>`;
}
</script>
</body>
</html>
