<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HireMind — Job Postings</title>
<link rel="stylesheet" href="css/design-system.css">
</head>
<body>
<div id="app-root"></div>
<script src="js/app.js"></script>
<script src="js/api.js"></script>
<script src="js/shell.js"></script>
<script>
startPage('Job Postings', '', ['hr', 'admin'], async body => {
  body.innerHTML = `<div class="section-header mb-24"><div><div class="section-title">Your jobs</div>
    <div class="section-subtitle">A job starts as a draft, is published so candidates can apply, and is closed when hiring ends.</div></div>
    <button class="btn btn-primary btn-sm" style="margin-left:auto" onclick="editJob()">+ New job</button></div>
    <div id="jobs" class="grid grid-3 gap-20"></div>`;
  await load();
});
let JOBS = [];
async function load() {
  JOBS = await api('/api/jobs');
  const counts = Object.fromEntries((await api('/api/analytics')).per_job.map(j => [j.job_id, j.applications]));
  document.getElementById('jobs').innerHTML = JOBS.length ? JOBS.map(j => `
    <div class="card"><div class="card-body">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
        <div><div style="font-weight:700;font-size:16px">${esc(j.title)}</div><div class="hm-note">${esc(j.level || 'Level not set')} · deadline ${fmtDate(j.deadline)}</div></div>
        ${statusBadge(j.status)}</div>
      <p style="font-size:13px;color:var(--mist);margin:10px 0">${esc(j.description)}</p>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">${j.required_skills.map(s => `<span class="chip">${esc(s)}</span>`).join('') || '<span class="hm-note">No required skills</span>'}</div>
      <div style="display:flex;align-items:center;justify-content:space-between">
        <span><strong style="font-size:20px;color:var(--teal)">${counts[j.id] || 0}</strong> <span class="hm-note">applications</span></span>
        <div class="hm-row-actions">
          ${j.status !== 'closed' ? `<button class="btn btn-ghost btn-sm" onclick="editJob(${j.id})">Edit</button>` : ''}
          ${j.status === 'draft' ? `<button class="btn btn-primary btn-sm" onclick="setStatus(${j.id},'publish')">Publish</button>` : ''}
          ${j.status === 'published' ? `<button class="btn btn-danger btn-sm" onclick="setStatus(${j.id},'close')">Close</button>` : ''}
        </div></div>
    </div></div>`).join('') : '<div class="hm-empty" style="grid-column:1/-1">No jobs yet. Create your first job.</div>';
}
function editJob(id) {
  const j = JOBS.find(x => x.id === id) || { title: '', description: '', required_skills: [], level: '', deadline: null };
  modal(`<div class="section-title mb-16">${id ? 'Edit job' : 'New job'}</div>
    <form onsubmit="saveJob(event, ${id || 'null'})">
      <div class="form-group"><label class="form-label">Title</label><input class="form-input" id="j-title" required minlength="2" value="${esc(j.title)}"></div>
      <div class="form-group"><label class="form-label">Description</label><textarea class="form-textarea" id="j-desc" required minlength="10" rows="4">${esc(j.description)}</textarea></div>
      <div class="form-group"><label class="form-label">Required skills (comma-separated; used for CV matching and assessments)</label><input class="form-input" id="j-skills" value="${esc(j.required_skills.join(', '))}" placeholder="sql, python, power bi"></div>
      <div class="grid grid-2 gap-16">
        <div class="form-group"><label class="form-label">Level</label><input class="form-input" id="j-level" value="${esc(j.level)}" placeholder="junior"></div>
        <div class="form-group"><label class="form-label">Deadline</label><input class="form-input" id="j-deadline" type="date" value="${j.deadline ? j.deadline.slice(0, 10) : ''}"></div>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary">Save</button></div>
    </form>
    ${id ? '' : '<p class="hm-note" style="margin-top:12px">A new job starts as a draft with the default scoring weights (version 1). Change them in Scoring & Ranking.</p>'}`);
}
async function saveJob(e, id) {
  e.preventDefault();
  const d = document.getElementById('j-deadline').value;
  const body = { title: document.getElementById('j-title').value.trim(), description: document.getElementById('j-desc').value.trim(),
    required_skills: document.getElementById('j-skills').value.split(',').map(s => s.trim().toLowerCase()).filter(Boolean),
    level: document.getElementById('j-level').value.trim(), deadline: d ? d + 'T23:59:00Z' : null };
  await act(() => api(id ? `/api/jobs/${id}` : '/api/jobs', { method: id ? 'PATCH' : 'POST', body }), id ? 'Job saved' : 'Job created as a draft');
  closeModal(); load();
}
async function setStatus(id, action) {
  await act(() => api(`/api/jobs/${id}/${action}`, { method: 'POST' }), action === 'publish' ? 'Job published' : 'Job closed');
  load();
}
</script>
</body>
</html>
