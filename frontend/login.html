<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HireMind — Sign in</title>
<link rel="icon" href="img/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/design-system.css">
<style>
body { display:grid; place-items:center; min-height:100vh; padding:20px; position:relative; overflow:hidden; }
body::before, body::after { content:""; position:absolute; border-radius:50%; z-index:0; pointer-events:none; }
body::before { width:420px; height:420px; background:var(--tint-1); top:-140px; right:-120px; }
body::after { width:300px; height:300px; background:var(--tint-2); bottom:-120px; left:-90px; }
.auth { position:relative; z-index:1; }
.auth .logo-icon { width:46px; height:46px; }
.auth { width:100%; max-width:420px; }
.tabs { display:flex; gap:6px; margin-bottom:18px; }
.tabs button { flex:1; }
</style>
</head>
<body>
<div class="auth card">
  <div class="card-body" style="padding:30px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:22px">
      <div class="logo-icon"><img src="img/logo.svg" alt=""></div>
      <div><div class="logo-text" style="font-size:22px">HireMind</div>
      <div class="tagline">AI-assisted recruitment with HR-led decisions</div></div>
    </div>
    <div class="tabs">
      <button class="btn btn-primary btn-sm" id="t-login" onclick="mode('login')">Sign in</button>
      <button class="btn btn-ghost btn-sm" id="t-reg" onclick="mode('register')">Create candidate account</button>
    </div>
    <form id="f" onsubmit="go(event)">
      <div class="form-group" id="g-name" style="display:none"><label class="form-label">Full name</label><input class="form-input" id="name" autocomplete="name"></div>
      <div class="form-group"><label class="form-label">Email</label><input class="form-input" id="email" type="email" required autocomplete="email"></div>
      <div class="form-group"><label class="form-label">Password</label><input class="form-input" id="pw" type="password" required minlength="8" autocomplete="current-password"></div>
      <button class="btn btn-primary" style="width:100%;justify-content:center" id="submit">Sign in</button>
    </form>
    <p class="hm-note" style="margin-top:16px">HR accounts are created by an administrator in Settings. Candidates can create their own account.</p>
  </div>
</div>
<script src="js/app.js"></script>
<script src="js/api.js"></script>
<script>
let current = 'login';
function mode(m) {
  current = m;
  document.getElementById('g-name').style.display = m === 'register' ? '' : 'none';
  document.getElementById('submit').textContent = m === 'register' ? 'Create account' : 'Sign in';
  document.getElementById('t-login').className = 'btn btn-sm ' + (m === 'login' ? 'btn-primary' : 'btn-ghost');
  document.getElementById('t-reg').className = 'btn btn-sm ' + (m === 'register' ? 'btn-primary' : 'btn-ghost');
}
async function go(e) {
  e.preventDefault();
  const email = document.getElementById('email').value.trim(), pw = document.getElementById('pw').value;
  try {
    if (current === 'register') await api('/api/auth/register', { method: 'POST', body: { email, password: pw, full_name: document.getElementById('name').value.trim() } });
    const t = await api('/api/auth/login', { method: 'POST', form: new URLSearchParams({ username: email, password: pw }) });
    Auth.token = t.access_token;
    const me = await api('/api/auth/me');
    location.href = me.role === 'candidate' ? 'portal.html' : 'index.html';
  } catch (err) { showToast(esc(err.message), 'error', 5000); }
}
</script>
</body>
</html>
