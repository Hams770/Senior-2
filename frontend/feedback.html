<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HireMind — Feedback</title>
<link rel="stylesheet" href="css/design-system.css">
</head>
<body>
<div id="app-root"></div>
<script src="js/app.js"></script>
<script src="js/api.js"></script>
<script src="js/shell.js"></script>
<script>
startPage('Feedback', '', ['hr', 'admin'], async body => {
  body.innerHTML = `<div class="section-header mb-24"><div><div class="section-title">Feedback to candidates</div>
    <div class="section-subtitle">Drafts are written from an anonymised summary. Nothing reaches a candidate until you approve and release it.</div></div>
    <div id="picker" style="margin-left:auto"></div></div><div class="card" id="list"></div>`;
  await jobPicker('picker', id => { JOB = id; load(); });
});
let JOB;
async function load() {
  const rows = (await api(`/api/jobs/${JOB}/candidates`)).filter(r => r.decision);
  const fbs = await Promise.all(rows.map(r => api(`/api/applications/${r.application_id}/feedback`)));
  document.getElementById('list').innerHTML = rows.length ? rows.map((r, i) => {
    const f = fbs[i].filter(x => x.status !== 'discarded').slice(-1)[0];
    return `<div class="card-body" style="border-bottom:1px solid var(--rule)">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><strong>${esc(r.candidate)}</strong>${statusBadge(r.decision)}
        ${f ? statusBadge(f.status) + (f.source === 'llm' ? `<span class="hm-note">drafted by ${esc(f.model)}</span>` : '<span class="hm-note">drafted from the template</span>') : ''}
        <button class="btn btn-ghost btn-sm" style="margin-left:auto" onclick="draft(${r.application_id})">${f ? 'New draft' : 'Draft feedback'}</button></div>
      ${f ? (f.status === 'released' ? `<p style="font-size:14px;line-height:1.6">${esc(f.approved_text)}</p><div class="hm-note">Released ${fmtDate(f.released_at)}</div>`
        : `<textarea class="form-textarea" id="fb-${f.id}" rows="6">${esc(f.approved_text || f.draft)}</textarea>
          <div class="hm-row-actions" style="margin-top:8px"><button class="btn btn-ghost btn-sm" onclick="approve(${f.id})">Approve this text</button>
          ${f.status === 'approved' ? `<button class="btn btn-primary btn-sm" onclick="release(${f.id})">Release to candidate</button>` : ''}</div>`) : ''}
    </div>`;
  }).join('') : '<div class="hm-empty">Record a decision for a candidate first; then you can draft their feedback here.</div>';
}
async function draft(id) { await act(() => api(`/api/applications/${id}/feedback`, { method: 'POST' }), 'Draft ready for review'); load(); }
async function approve(id) {
  await act(() => api(`/api/feedback/${id}/approve`, { method: 'POST', body: { text: document.getElementById('fb-' + id).value } }), 'Approved');
  load();
}
async function release(id) { await act(() => api(`/api/feedback/${id}/release`, { method: 'POST' }), 'Released'); load(); }
</script>
</body>
</html>
