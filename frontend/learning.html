<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartRecruit AI — Learning Loop</title>
<link rel="stylesheet" href="css/design-system.css">
<style>
.loop-diagram { display:flex; align-items:center; justify-content:center; gap:0; flex-wrap:wrap; padding:24px 0; }
.loop-node {
  display:flex; flex-direction:column; align-items:center; gap:8px;
  width:110px; text-align:center;
}
.loop-icon { width:56px; height:56px; border-radius:50%; display:grid; place-items:center; font-size:22px; border:2px solid; }
.loop-label { font-size:11px; font-weight:600; color:var(--mist); }
.loop-arrow { font-size:20px; color:var(--teal); margin: 0 -4px; opacity:0.6; }
.update-item { display:flex; align-items:flex-start; gap:14px; padding:14px 0; border-bottom:1px solid rgba(255,255,255,0.04); }
.update-item:last-child { border-bottom:none; }
.update-icon { width:38px; height:38px; border-radius:var(--radius-md); display:grid; place-items:center; font-size:16px; flex-shrink:0; }
.update-title { font-size:13px; font-weight:600; margin-bottom:3px; }
.update-desc { font-size:12px; color:var(--mist); line-height:1.5; }
.weight-diff { font-family:var(--font-mono); font-size:13px; }
.weight-diff.up { color:var(--emerald); }
.weight-diff.down { color:var(--rose); }
.hr-feedback-row { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid rgba(255,255,255,0.04); }
.hr-feedback-row:last-child { border-bottom:none; }
.star-rating { display:flex; gap:2px; font-size:14px; }
</style>
</head>
<body>
<div id="app-root"></div>
<script src="js/shell.js"></script>
<script src="js/app.js"></script>
<script>
renderShell('Learning Loop', '');

const body = document.getElementById('page-body');
body.innerHTML = `
<div class="section-header animate-in">
  <div>
    <div class="section-title">Continuous Learning Loop</div>
    <div class="section-subtitle">HR feedback drives automated refinement of scoring criteria over time</div>
  </div>
  <div style="display:flex;gap:10px">
    <span class="badge badge-teal animate-in" style="animation:pulse 2s infinite">● Loop Active</span>
    <button class="btn btn-primary" onclick="triggerUpdate()">🔄 Trigger Update</button>
  </div>
</div>

<!-- Loop Diagram -->
<div class="card animate-in animate-in-delay-1 mb-20">
  <div class="card-header"><span class="card-title">System Learning Architecture</span></div>
  <div class="card-body">
    <div class="loop-diagram">
      <div class="loop-node">
        <div class="loop-icon" style="background:rgba(0,212,180,0.1);border-color:rgba(0,212,180,0.3);color:var(--teal)">📄</div>
        <div class="loop-label">CV Data Ingestion</div>
      </div>
      <div class="loop-arrow">→</div>
      <div class="loop-node">
        <div class="loop-icon" style="background:rgba(124,106,247,0.1);border-color:rgba(124,106,247,0.3);color:var(--violet)">🧠</div>
        <div class="loop-label">LLM Analysis</div>
      </div>
      <div class="loop-arrow">→</div>
      <div class="loop-node">
        <div class="loop-icon" style="background:rgba(255,179,71,0.1);border-color:rgba(255,179,71,0.3);color:var(--amber)">📊</div>
        <div class="loop-label">Scoring Engine</div>
      </div>
      <div class="loop-arrow">→</div>
      <div class="loop-node">
        <div class="loop-icon" style="background:rgba(56,189,248,0.1);border-color:rgba(56,189,248,0.3);color:var(--sky)">✅</div>
        <div class="loop-label">Hiring Decision</div>
      </div>
      <div class="loop-arrow">→</div>
      <div class="loop-node">
        <div class="loop-icon" style="background:rgba(34,197,94,0.1);border-color:rgba(34,197,94,0.3);color:var(--emerald)">💬</div>
        <div class="loop-label">HR Feedback</div>
      </div>
      <div class="loop-arrow">→</div>
      <div class="loop-node">
        <div class="loop-icon" style="background:rgba(255,95,109,0.1);border-color:rgba(255,95,109,0.3);color:var(--rose)">🔄</div>
        <div class="loop-label">Weight Refinement</div>
      </div>
    </div>
    <div class="divider"></div>
    <div style="font-size:13px;color:var(--mist);text-align:center;line-height:1.7">
      The system automatically analyzes successful hire patterns from HR feedback and post-hire performance data.<br>
      Scoring weights are refined periodically to improve future candidate matching accuracy.
    </div>
  </div>
</div>

<div class="grid grid-3 gap-20 mb-20">
  <div class="stat-card animate-in" style="--accent:var(--teal)">
    <span class="stat-icon">📋</span>
    <div class="stat-label">Feedback Records</div>
    <div class="stat-value" id="c1">0</div>
    <div class="stat-delta">Used for learning</div>
  </div>
  <div class="stat-card animate-in animate-in-delay-1" style="--accent:var(--emerald)">
    <span class="stat-icon">🎯</span>
    <div class="stat-label">Accuracy Gain</div>
    <div class="stat-value" id="c2">0</div>
    <div class="stat-delta">Since baseline</div>
  </div>
  <div class="stat-card animate-in animate-in-delay-2" style="--accent:var(--violet)">
    <span class="stat-icon">🔄</span>
    <div class="stat-label">Updates Applied</div>
    <div class="stat-value" id="c3">0</div>
    <div class="stat-delta">Automated weight changes</div>
  </div>
</div>

<div class="grid grid-2 gap-20">
  <!-- Weight History -->
  <div class="card animate-in animate-in-delay-2">
    <div class="card-header">
      <span class="card-title">Weight Change History</span>
      <span class="badge badge-emerald">Auto-updated</span>
    </div>
    <div class="card-body" id="update-log">
      ${[
        {date:'2026-04-28',factor:'Technical Skills',from:30,to:35,reason:'Verified candidates with higher technical scores had 2.1× retention rate',up:true},
        {date:'2026-04-15',factor:'Soft Skills',from:15,to:10,reason:'Soft skills score alone showed weak correlation with 90-day performance',up:false},
        {date:'2026-04-01',factor:'Verification Score',from:5,to:10,reason:'Candidates who passed skill tests accepted offers 3.2× more often',up:true},
        {date:'2026-03-15',factor:'Education Fit',from:25,to:20,reason:'Portfolio and experience showed stronger correlation than formal education',up:false},
      ].map(u=>`
        <div class="update-item">
          <div class="update-icon" style="background:${u.up?'rgba(34,197,94,0.1)':'rgba(255,95,109,0.1)'}">${u.up?'📈':'📉'}</div>
          <div style="flex:1">
            <div class="update-title">${u.factor} <span class="weight-diff ${u.up?'up':'down'}">${u.from}% → ${u.to}% (${u.up?'+':''}${u.to-u.from}%)</span></div>
            <div class="update-desc">${u.reason}</div>
            <div style="font-size:10px;color:var(--mist);margin-top:4px;font-family:var(--font-mono)">${u.date}</div>
          </div>
        </div>
      `).join('')}
    </div>
  </div>

  <!-- HR Feedback Input -->
  <div>
    <div class="card animate-in animate-in-delay-3 mb-20">
      <div class="card-header"><span class="card-title">Submit HR Evaluation</span></div>
      <div class="card-body">
        <div class="form-group">
          <label class="form-label">Candidate</label>
          <select class="form-select">
            <option>Sara Al-Rashid (Software Engineer)</option>
            <option>James Okafor (DevOps Engineer)</option>
            <option>Ahmed Hassan (Data Scientist)</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Outcome</label>
          <select class="form-select">
            <option>✅ Successful Hire</option>
            <option>❌ Rejected After Interview</option>
            <option>🔄 Still in Progress</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Performance Rating (1–5 stars)</label>
          <div style="display:flex;gap:8px;font-size:28px;cursor:pointer" id="star-rating">
            ${[1,2,3,4,5].map(s=>`<span onclick="setRating(${s})" style="opacity:.3;transition:opacity .2s">⭐</span>`).join('')}
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Evaluation Comments</label>
          <textarea class="form-textarea" placeholder="Share your evaluation insights to improve the AI model…"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Post-Hire Performance Score (optional)</label>
          <input class="form-input" type="number" min="0" max="100" placeholder="Score after 90-day review (0–100)">
        </div>
        <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="submitFeedback()">
          💾 Submit to Learning Loop
        </button>
      </div>
    </div>

    <!-- Recent HR Feedback -->
    <div class="card animate-in animate-in-delay-4">
      <div class="card-header"><span class="card-title">Recent HR Feedback</span></div>
      <div class="card-body">
        ${[
          {n:'Sara Al-Rashid',outcome:'Hired',rating:5,perf:91,date:'2026-04-20'},
          {n:'James Okafor',outcome:'Hired',rating:4,perf:85,date:'2026-04-18'},
          {n:'Carlos Ruiz',outcome:'Rejected',rating:2,perf:null,date:'2026-04-15'},
          {n:'Priya Sharma',outcome:'Hired',rating:5,perf:88,date:'2026-04-10'},
        ].map(f=>`
          <div class="hr-feedback-row">
            <div class="avatar" style="width:34px;height:34px;font-size:12px">${f.n.split(' ').map(x=>x[0]).join('')}</div>
            <div style="flex:1">
              <div style="font-size:13px;font-weight:600">${f.n}</div>
              <div class="star-rating">${'⭐'.repeat(f.rating)}${'☆'.repeat(5-f.rating)}</div>
            </div>
            <div style="text-align:right">
              <span class="badge ${f.outcome==='Hired'?'badge-teal':'badge-rose'}">${f.outcome}</span>
              ${f.perf!==null?`<div style="font-size:11px;color:var(--mist);margin-top:3px">Perf: ${f.perf}/100</div>`:''}
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  </div>
</div>
`;

animateCount(document.getElementById('c1'), 127);
animateCount(document.getElementById('c2'), 18, 1200, '%');
animateCount(document.getElementById('c3'), 12);

let currentRating = 0;
function setRating(r) {
  currentRating = r;
  document.querySelectorAll('#star-rating span').forEach((s,i)=>{
    s.style.opacity = i<r ? '1' : '.3';
  });
}

function submitFeedback() {
  if(!currentRating) { showToast('Please provide a star rating','warning'); return; }
  showToast('Feedback submitted! Learning loop will update in next cycle.','success');
  setRating(0);
}

function triggerUpdate() {
  showToast('Learning loop update triggered — analyzing 127 feedback records…','info');
  setTimeout(()=>showToast('Scoring weights updated! Accuracy improved by 2.1%','success'),3000);
}
</script>
</body>
</html>
