<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HireMind — Skill Verification</title>
<link rel="icon" href="img/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/design-system.css">
</head>
<body>
<div id="app-root"></div>
<script src="js/app.js"></script>
<script src="js/api.js"></script>
<script src="js/shell.js"></script>
<script>
startPage('Skill Verification', '', ['hr', 'admin'], async body => {
  body.innerHTML = `<div class="section-header mb-24"><div><div class="section-title">Assessments</div>
    <div class="section-subtitle">Short tests that check the skills a CV claims. Multiple choice is marked automatically; practical answers are marked by you with the rubric.</div></div>
    <div id="picker" style="margin-left:auto"></div></div>
    <div class="grid grid-2 gap-20 mb-24"><div class="card" id="tests"></div><div class="card" id="assign"></div></div>
    <div class="card" id="grading"></div>`;
  await jobPicker('picker', id => { JOB = id; load(); });
});
let JOB, TESTS = [], JOBINFO;
async function load() {
  [TESTS, JOBINFO] = await Promise.all([api(`/api/jobs/${JOB}/assessments`), api(`/api/jobs/${JOB}`)]);
  document.getElementById('tests').innerHTML = `<div class="card-header"><span class="card-title">Assessments for this job</span>
    <button class="btn btn-primary btn-sm" onclick="newTest()">New assessment</button></div>
    ${TESTS.length ? `<table class="data-table"><tbody>${TESTS.map(t => `<tr><td><strong>${esc(t.title)}</strong><div class="hm-note">${esc(t.skill)} · ${t.type === 'mcq' ? t.content.questions.length + ' questions' : 'practical, rubric of ' + t.content.rubric.length} · ${t.time_limit_min} min</div></td></tr>`).join('')}</tbody></table>`
    : '<div class="hm-empty">No assessments yet.</div>'}`;
  const cands = await api(`/api/jobs/${JOB}/candidates`);
  document.getElementById('assign').innerHTML = `<div class="card-header"><span class="card-title">Assign to an applicant</span></div><div class="card-body">
    ${cands.length && TESTS.length ? `<div class="form-group"><select class="form-select" id="a-app">${cands.map(c => `<option value="${c.application_id}">${esc(c.candidate)}</option>`).join('')}</select></div>
      <div class="form-group">${TESTS.map(t => `<label style="display:flex;gap:8px;font-size:13px;margin-bottom:6px"><input type="checkbox" value="${t.id}" class="a-test"> ${esc(t.title)}</label>`).join('')}</div>
      <button class="btn btn-primary btn-sm" onclick="assign()">Assign</button>`
    : '<div class="hm-note">Create an assessment and wait for applications first.</div>'}</div>`;
  const attempts = await api(`/api/jobs/${JOB}/attempts`);
  document.getElementById('grading').innerHTML = `<div class="card-header"><span class="card-title">Attempts</span></div>
    ${attempts.length ? `<table class="data-table"><thead><tr><th>Candidate</th><th>Assessment</th><th>Status</th><th>Score</th><th></th></tr></thead><tbody>
    ${attempts.map(a => `<tr><td>${esc(a.candidate)}</td><td>${esc(a.assessment.title)}</td><td>${statusBadge(a.status)}</td><td>${a.score === null ? (a.status === 'expired' ? 'not assessed' : '—') : Math.round(a.score)}</td>
      <td>${a.status === 'submitted' ? `<button class="btn btn-primary btn-sm" onclick='grade(${a.id})'>Mark</button>` : ''}</td></tr>`).join('')}</tbody></table>`
    : '<div class="hm-empty">No attempts yet.</div>'}`;
  window.ATTEMPTS = attempts;
}
function newTest() {
  modal(`<div class="section-title mb-16">New assessment</div>
    <div class="grid grid-3 gap-16">
      <div class="form-group"><label class="form-label">Skill</label><select class="form-select" id="t-skill">${JOBINFO.required_skills.map(s => `<option>${esc(s)}</option>`).join('')}</select></div>
      <div class="form-group"><label class="form-label">Type</label><select class="form-select" id="t-type" onchange="typeFields()"><option value="mcq">Multiple choice</option><option value="practical">Practical</option></select></div>
      <div class="form-group"><label class="form-label">Minutes</label><input class="form-input" id="t-min" type="text" inputmode="numeric" value="15"></div></div>
    <div class="form-group"><label class="form-label">Title</label><input class="form-input" id="t-title"></div>
    <div id="t-fields"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveTest()">Create</button></div>`);
  typeFields();
}
function typeFields() {
  const mcq = document.getElementById('t-type').value === 'mcq';
  document.getElementById('t-fields').innerHTML = mcq
    ? `<div class="form-group"><label class="form-label">Questions: one block per question. First line is the question, then one option per line; start the correct option with *</label>
       <textarea class="form-textarea" id="t-q" rows="9" placeholder="Which clause filters groups?\nWHERE\n*HAVING\nORDER BY\n\nWhich join keeps all rows of the left table?\nINNER\n*LEFT"></textarea></div>`
    : `<div class="form-group"><label class="form-label">Task for the candidate</label><textarea class="form-textarea" id="t-prompt" rows="3"></textarea></div>
       <div class="form-group"><label class="form-label">Rubric: one criterion per line as "criterion | maximum points"</label>
       <textarea class="form-textarea" id="t-rubric" rows="3" placeholder="Correct approach | 6\nClear explanation | 4"></textarea></div>
       <p class="hm-note">Answers are text only; candidate code is never run.</p>`;
}
async function saveTest() {
  const type = document.getElementById('t-type').value;
  const body = { skill: document.getElementById('t-skill').value, type, title: document.getElementById('t-title').value.trim(), time_limit_min: toNumber(document.getElementById('t-min').value) };
  if (type === 'mcq') {
    body.questions = document.getElementById('t-q').value.trim().split(/\n\s*\n/).map(block => {
      const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
      const options = lines.slice(1);
      return { text: lines[0] || '', options: options.map(o => o.replace(/^\*/, '').trim()), answer: options.findIndex(o => o.startsWith('*')) };
    });
  } else {
    body.prompt = document.getElementById('t-prompt').value.trim();
    body.rubric = document.getElementById('t-rubric').value.split('\n').map(l => l.trim()).filter(Boolean)
      .map(l => { const [c, p] = l.split('|'); return { criterion: (c || '').trim(), max_points: toNumber(p) }; });
  }
  await act(() => api(`/api/jobs/${JOB}/assessments`, { method: 'POST', body }), 'Assessment created');
  closeModal(); load();
}
async function assign() {
  const ids = [...document.querySelectorAll('.a-test:checked')].map(c => Number(c.value));
  if (!ids.length) return showToast('Tick at least one assessment', 'warning');
  await act(() => api(`/api/applications/${document.getElementById('a-app').value}/assessments`, { method: 'POST', body: { assessment_ids: ids } }), 'Assigned');
  load();
}
function grade(id) {
  const a = ATTEMPTS.find(x => x.id === id);
  modal(`<div class="section-title mb-8">${esc(a.assessment.title)}</div>
    <div class="hm-note mb-8">Task: ${esc(a.assessment.content.prompt)}</div>
    <div class="card mb-16"><div class="card-body" style="white-space:pre-wrap;font-size:14px">${esc(a.answers.response)}</div></div>
    ${a.assessment.content.rubric.map((r, i) => `<div class="form-group"><label class="form-label">${esc(r.criterion)} (0–${r.max_points})</label>
      <input class="form-input g-pt" data-c="${esc(r.criterion)}" type="text" inputmode="decimal"></div>`).join('')}
    <div class="form-group"><label class="form-label">Notes</label><input class="form-input" id="g-notes"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveGrade(${id})">Save marks</button></div>`);
}
async function saveGrade(id) {
  const points = Object.fromEntries([...document.querySelectorAll('.g-pt')].map(i => [i.dataset.c, toNumber(i.value)]));
  await act(() => api(`/api/attempts/${id}/grade`, { method: 'POST', body: { points, notes: document.getElementById('g-notes').value } }), 'Marked');
  closeModal(); load();
}
</script>
</body>
</html>
