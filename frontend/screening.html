<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HireMind — CV Screening</title>
<link rel="stylesheet" href="css/design-system.css">
</head>
<body>
<div id="app-root"></div>
<script src="js/app.js"></script>
<script src="js/api.js"></script>
<script src="js/shell.js"></script>
<script>
startPage('CV Screening', '', ['hr', 'admin'], async body => {
  body.innerHTML = `<div class="section-header mb-24"><div><div class="section-title">Evidence from each CV</div>
    <div class="section-subtitle">Skills the parser found, with the sentence each one came from. Correct anything it got wrong.</div></div>
    <div id="picker" style="margin-left:auto"></div></div>
    <div class="grid gap-20" style="grid-template-columns:280px 1fr"><div class="card" id="apps" style="align-self:start"></div><div id="detail"></div></div>`;
  const wanted = Number(new URLSearchParams(location.search).get('app')) || null;
  await jobPicker('picker', async id => { JOB = id; await loadApps(wanted); });
});
let JOB, CURRENT;
async function loadApps(select) {
  const rows = await api(`/api/jobs/${JOB}/candidates`);
  document.getElementById('apps').innerHTML = rows.length ? rows.map(r => `
    <button class="hm-list-item" data-id="${r.application_id}" onclick="show(${r.application_id})">
      <span>${esc(r.candidate)}</span>${statusBadge(r.parse_status)}</button>`).join('') : '<div class="hm-empty">No applications yet.</div>';
  const first = rows.find(r => r.application_id === select) || rows[0];
  if (first) show(first.application_id); else document.getElementById('detail').innerHTML = '';
}
function highlight(excerpt, skill) {
  const safe = esc(excerpt), re = new RegExp('(' + skill.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
  return safe.replace(re, '<mark>$1</mark>');
}
async function show(id) {
  CURRENT = id;
  document.querySelectorAll('.hm-list-item').forEach(b => b.classList.toggle('active', Number(b.dataset.id) === id));
  const p = await api(`/api/applications/${id}/parsed`);
  const active = p.skills.filter(s => s.active);
  document.getElementById('detail').innerHTML = `
    <div class="card mb-16"><div class="card-header"><span class="card-title">Parsing result</span>${statusBadge(p.parse_status)}</div><div class="card-body">
      ${p.parse_error ? `<p class="hm-alert">${esc(p.parse_error)}. Type the CV text and its skills below so the candidate can still be evaluated.</p>` : ''}
      <div class="hm-note">Sections found: ${Object.keys(p.sections).filter(k => k !== 'header').map(esc).join(', ') || 'none'}</div></div></div>
    <div class="card mb-16"><div class="card-header"><span class="card-title">Skills and their evidence (${active.length})</span></div>
      ${active.length ? `<table class="data-table"><tbody>${active.map(s => `<tr><td style="width:160px"><strong>${esc(s.skill)}</strong><div class="hm-note">${s.origin === 'hr' ? 'added by HR' : esc(s.section)}</div></td>
        <td class="hm-excerpt">${s.source_excerpt ? highlight(s.source_excerpt, s.skill) : '—'}</td></tr>`).join('')}</tbody></table>` : '<div class="hm-empty">No skills recorded.</div>'}</div>
    <div class="card"><div class="card-header"><span class="card-title">Correct the evidence</span></div><div class="card-body">
      <div class="form-group"><label class="form-label">Skills, one per line (skill | supporting sentence)</label>
        <textarea class="form-textarea" id="c-skills" rows="6">${active.map(s => esc(s.skill + (s.source_excerpt ? ' | ' + s.source_excerpt : ''))).join('\n')}</textarea></div>
      ${p.parse_status === 'failed' || p.parse_status === 'corrected' ? `<div class="form-group"><label class="form-label">CV text</label>
        <textarea class="form-textarea" id="c-text" rows="5">${esc(p.text || '')}</textarea></div>` : ''}
      <div class="form-group"><label class="form-label">Reason for the correction</label><input class="form-input" id="c-reason" placeholder="For example: parser missed SQL in the projects section"></div>
      <div class="hm-row-actions"><button class="btn btn-primary btn-sm" onclick="saveCorrection()">Save correction</button>
      ${p.parse_status !== 'corrected' ? '<button class="btn btn-ghost btn-sm" onclick="reparse()">Run the parser again</button>' : ''}</div>
      <p class="hm-note" style="margin-top:10px">The parser's original output is kept; your correction and its reason go to the audit log.</p></div></div>`;
}
async function saveCorrection() {
  const skills = document.getElementById('c-skills').value.split('\n').map(l => l.trim()).filter(Boolean)
    .map(l => { const [skill, ...rest] = l.split('|'); return { skill: skill.trim(), source_excerpt: rest.join('|').trim() }; });
  const textEl = document.getElementById('c-text');
  const body = { skills, reason: document.getElementById('c-reason').value.trim() };
  if (textEl) body.text = textEl.value;
  await act(() => api(`/api/applications/${CURRENT}/parsed`, { method: 'PATCH', body }), 'Correction saved');
  loadApps(CURRENT);
}
async function reparse() {
  await act(() => api(`/api/applications/${CURRENT}/parse`, { method: 'POST' }), 'Parser run again');
  show(CURRENT);
}
</script>
</body>
</html>
