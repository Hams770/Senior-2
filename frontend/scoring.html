<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HireMind — Scoring TITLE Ranking</title>
<link rel="icon" href="img/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/design-system.css">
</head>
<body>
<div id="app-root"></div>
<script src="js/app.js"></script>
<script src="js/api.js"></script>
<script src="js/shell.js"></script>
<script>
startPage('Scoring & Ranking', '', ['hr', 'admin'], async body => {
  body.innerHTML = `<div class="section-header mb-24"><div><div class="section-title">Weights and ranking</div>
    <div class="section-subtitle">Saving new weights creates a new policy version; existing evaluations keep the version they used.</div></div>
    <div id="picker" style="margin-left:auto"></div></div>
    <div class="grid gap-20" style="grid-template-columns:340px 1fr"><div class="card" id="weights"></div><div class="card" id="ranking"></div></div>`;
  await jobPicker('picker', id => { JOB = id; load(); });
});
let JOB;
const NAMES = { tech: 'Technical skills match', exp: 'Experience', edu: 'Education', soft: 'Soft skills', ver: 'Skill assessments' };
async function load() {
  const [policies, rank] = await Promise.all([api(`/api/jobs/${JOB}/policies`), api(`/api/jobs/${JOB}/ranking`)]);
  const p = policies[policies.length - 1];
  document.getElementById('weights').innerHTML = `<div class="card-header"><span class="card-title">Policy v${p.version}</span><span class="hm-note">${fmtDate(p.created_at)}</span></div>
    <div class="card-body">${Object.keys(NAMES).map(k => `<div class="form-group"><label class="form-label" style="display:flex;justify-content:space-between">${NAMES[k]}<strong id="v-${k}">${p.weights[k]}</strong></label>
      <input type="range" min="0" max="60" value="${p.weights[k]}" id="w-${k}" oninput="sync()" style="width:100%"></div>`).join('')}
      <div class="hm-note mb-16" id="w-total"></div>
      <button class="btn btn-primary btn-sm" onclick="savePolicy()">Save as version ${p.version + 1}</button></div>`;
  sync();
  document.getElementById('ranking').innerHTML = `<div class="card-header"><span class="card-title">Ranking</span><span class="hm-note">equal scores share a rank</span></div>
    ${rank.length ? `<table class="data-table"><thead><tr><th>Rank</th><th>Candidate</th><th>Score</th><th>Not assessed</th><th>Decision</th></tr></thead><tbody>
    ${rank.map(r => `<tr><td><strong>${r.rank}</strong></td><td>${esc(r.candidate)}</td><td><strong>${fmtScore(r.score)}</strong> ${statusBadge(r.stage)}<div class="hm-note">policy v${r.policy_version}</div></td>
      <td>${r.not_assessed.map(k => NAMES[k]).join(', ') || '—'}</td><td>${r.decision ? statusBadge(r.decision) : '—'}</td></tr>`).join('')}</tbody></table>`
    : '<div class="hm-empty">No evaluated candidates yet. Evaluate them in Candidates.</div>'}`;
}
function sync() {
  let total = 0;
  for (const k of Object.keys(NAMES)) { const v = Number(document.getElementById('w-' + k).value); total += v; document.getElementById('v-' + k).textContent = v; }
  document.getElementById('w-total').textContent = total > 0 ? `Total ${total}. Weights are used as proportions, so they need not add up to 100.` : 'At least one weight must be above zero.';
}
async function savePolicy() {
  const weights = Object.fromEntries(Object.keys(NAMES).map(k => [k, Number(document.getElementById('w-' + k).value)]));
  await act(() => api(`/api/jobs/${JOB}/policies`, { method: 'POST', body: { weights } }), 'New policy version saved');
  load();
}
</script>
</body>
</html>
