<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HireMind — Analytics</title>
<link rel="stylesheet" href="css/design-system.css">
</head>
<body>
<div id="app-root"></div>
<script src="js/app.js"></script>
<script src="js/api.js"></script>
<script src="js/shell.js"></script>
<script>
startPage('Analytics', 'from stored records', ['hr', 'admin'], async body => {
  const a = await api('/api/analytics');
  const bars = (obj, color) => {
    const entries = Object.entries(obj); const max = Math.max(1, ...entries.map(e => e[1]));
    return entries.length ? entries.map(([k, v]) => `<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">
      <span>${esc(k.replace('_', ' '))}</span><strong>${v}</strong></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${100 * v / max}%;background:${color}"></div></div></div>`).join('')
      : '<div class="hm-empty">No data yet.</div>';
  };
  const hist = Object.fromEntries(a.evaluations.histogram.map((n, i) => [`${i * 20}–${i === 4 ? 100 : i * 20 + 19}`, n]));
  body.innerHTML = `
  <p class="hm-note mb-24">Counts and scores are computed live from the database for your jobs. There is no sample data on this page.</p>
  <div class="grid grid-2 gap-20 mb-24">
    <div class="card"><div class="card-header"><span class="card-title">Score distribution (latest evaluation)</span></div><div class="card-body">${bars(hist, 'var(--teal)')}</div></div>
    <div class="card"><div class="card-header"><span class="card-title">Applications by status</span></div><div class="card-body">${bars(a.application_status, 'var(--violet)')}</div></div>
    <div class="card"><div class="card-header"><span class="card-title">HR decisions</span></div><div class="card-body">${bars(a.decisions, 'var(--emerald)')}</div></div>
    <div class="card"><div class="card-header"><span class="card-title">Most common skills in CVs</span></div><div class="card-body">${bars(Object.fromEntries(a.top_skills), 'var(--amber)')}</div></div>
    <div class="card"><div class="card-header"><span class="card-title">CV parsing</span></div><div class="card-body">${bars(a.parse_status, 'var(--sky)')}</div></div>
    <div class="card"><div class="card-header"><span class="card-title">Assessments</span></div><div class="card-body">${bars(a.assessments, 'var(--rose)')}</div></div>
  </div>
  <div class="card"><div class="card-header"><span class="card-title">Per job</span></div>
    <table class="data-table"><thead><tr><th>Job</th><th>Status</th><th>Applications</th><th>Evaluated</th><th>Mean score</th><th>Policy version</th></tr></thead><tbody>
    ${a.per_job.map(j => `<tr><td>${esc(j.title)}</td><td>${statusBadge(j.status)}</td><td>${j.applications}</td><td>${j.evaluated}</td><td>${fmtScore(j.mean_score)}</td><td>v${j.policy_version ?? '—'}</td></tr>`).join('')}
    </tbody></table></div>`;
});
</script>
</body>
</html>
